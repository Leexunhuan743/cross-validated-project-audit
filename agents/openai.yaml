interface:
  display_name: "交叉验证多代理审计"
  short_description: "高风险项目的多代理异质审计、证据复核、发布门禁与修复验证"
  default_prompt: "使用 $cross-validated-project-audit 对当前高风险工件执行异质交叉审计，并输出证据可追溯的决策报告。"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  # false：本协议会在 .audits/ 建档、派发多路调查并运行校验器，成本很高。
  # 隐式调用会让「帮我看看这段代码」这类轻量请求被误判为重型审计。
  allow_implicit_invocation: false
